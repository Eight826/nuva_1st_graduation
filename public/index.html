<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nuva — 身份抽取</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#0A0A0A",
              panel: "#1F1F1F",
              line: "#2A2A2A",
              mute: "#A3A3A3",
              brand: "#3B6FE8",
              tagBlue: { bg: "#1E2A4A", fg: "#7FA8F5" },
              tagGreen: { bg: "#1B3B2A", fg: "#6FCB9F" },
              tagAmber: { bg: "#3B2E1B", fg: "#E0B36F" },
            },
            fontFamily: {
              sans: ['"Noto Sans TC"', "system-ui", "sans-serif"],
            },
            boxShadow: {
              glow: "0 0 40px rgba(59, 111, 232, 0.35)",
            },
          },
        },
      };
    </script>
    <style>
      html,
      body {
        background: #0a0a0a;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(59, 111, 232, 0.18), transparent 55%),
          radial-gradient(ellipse 60% 40% at 80% 100%, rgba(31, 31, 31, 0.9), transparent 50%),
          #0a0a0a;
      }

      .scene {
        perspective: 1200px;
      }

      .card-3d {
        position: relative;
        width: 100%;
        min-height: 300px;
        transform-style: preserve-3d;
        transition: transform 1.05s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .card-3d.is-flipped {
        transform: rotateY(180deg);
      }

      .card-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border: 1px solid #2a2a2a;
        background:
          linear-gradient(160deg, rgba(59, 111, 232, 0.08), transparent 42%),
          #1f1f1f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
      }

      .card-face.front::after {
        content: "";
        position: absolute;
        inset: -1px;
        border: 1px solid transparent;
        background: linear-gradient(120deg, transparent, rgba(59, 111, 232, 0.55), transparent) border-box;
        -webkit-mask:
          linear-gradient(#000 0 0) padding-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: sheen 2.4s ease-in-out infinite;
        pointer-events: none;
      }

      .card-face.back {
        transform: rotateY(180deg);
      }

      .card-3d.is-flipped .card-face.back {
        box-shadow: 0 0 0 1px rgba(59, 111, 232, 0.7), 0 0 48px rgba(59, 111, 232, 0.35);
        animation: borderFlash 1s ease-out;
      }

      .card-3d.is-revealing {
        animation: cardPulse 0.45s ease-out;
      }

      .card-3d.is-spinning {
        transition: none;
        animation: cardSpinDraw 2.4s cubic-bezier(0.12, 0.7, 0.18, 1) forwards;
      }

      .draw-status {
        min-height: 1.25rem;
      }

      @keyframes borderFlash {
        0% {
          box-shadow: 0 0 0 1px rgba(59, 111, 232, 1), 0 0 72px rgba(59, 111, 232, 0.65);
        }
        100% {
          box-shadow: 0 0 0 1px rgba(59, 111, 232, 0.45), 0 0 32px rgba(59, 111, 232, 0.2);
        }
      }

      @keyframes sheen {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 0.9;
        }
      }

      @keyframes cardPulse {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(1.02);
          filter: drop-shadow(0 0 18px rgba(59, 111, 232, 0.45));
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes cardSpinDraw {
        0% {
          transform: rotateY(0deg);
        }
        100% {
          transform: rotateY(1440deg);
        }
      }

      .btn-draw-glow {
        box-shadow: 0 0 0 0 rgba(59, 111, 232, 0.45);
        animation: ctaPulse 2.2s ease-in-out infinite;
      }

      @keyframes ctaPulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(59, 111, 232, 0.35);
        }
        50% {
          box-shadow: 0 0 28px 2px rgba(59, 111, 232, 0.35);
        }
      }

      .fade-in {
        animation: fadeUp 0.45s ease-out both;
      }

      .role-pop {
        animation: rolePop 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both;
      }

      @keyframes rolePop {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .input-field:focus {
        outline: none;
        border-color: #3b6fe8;
        box-shadow: 0 0 0 3px rgba(59, 111, 232, 0.2);
      }

      .btn-primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        animation: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .card-3d,
        .card-face.front::after,
        .btn-draw-glow,
        .role-pop,
        .fade-in {
          animation: none !important;
          transition: none !important;
        }

        .card-3d.is-spinning {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body class="font-sans text-white antialiased">
    <div class="mx-auto flex min-h-screen max-w-lg flex-col px-5 pb-16 pt-10 sm:pt-16">
      <header class="mb-10 text-center fade-in">
        <p class="mb-3 text-xs font-medium tracking-[0.08em] text-brand lowercase">nuva</p>
        <h1 class="text-3xl font-semibold tracking-tight sm:text-4xl">身份抽取</h1>
        <p class="mt-3 text-sm text-mute">輸入報到資訊，抽取你的遊戲身分</p>
      </header>

      <main class="flex-1">
        <!-- Step 1: Verify -->
        <section id="step-verify" class="fade-in">
          <form id="verify-form" class="space-y-4" autocomplete="off">
            <label class="block">
              <span class="mb-1.5 block text-xs text-mute">大使編號</span>
              <input
                id="input-id"
                name="id"
                type="text"
                inputmode="numeric"
                required
                class="input-field w-full border border-line bg-panel px-4 py-3 text-base text-white placeholder:text-mute/50"
                placeholder="例如 12"
              />
            </label>
            <label class="block">
              <span class="mb-1.5 block text-xs text-mute">大使姓名</span>
              <input
                id="input-name"
                name="name"
                type="text"
                required
                class="input-field w-full border border-line bg-panel px-4 py-3 text-base text-white placeholder:text-mute/50"
                placeholder="與名單完全一致"
              />
            </label>
            <label class="block">
              <span class="mb-1.5 block text-xs text-mute">報到 PIN</span>
              <input
                id="input-pin"
                name="pin"
                type="password"
                inputmode="numeric"
                maxlength="8"
                required
                class="input-field w-full border border-line bg-panel px-4 py-3 text-base tracking-widest text-white placeholder:text-mute/50"
                placeholder="報到時發放的 PIN"
              />
            </label>
            <p id="verify-error" class="hidden text-sm text-red-400" role="alert"></p>
            <button
              id="btn-verify"
              type="submit"
              class="btn-primary mt-2 w-full bg-brand px-4 py-3.5 text-sm font-semibold tracking-wide text-white transition hover:brightness-110"
            >
              進入驗證
            </button>
          </form>
        </section>

        <!-- Step 2: Draw -->
        <section id="step-draw" class="hidden fade-in">
          <div class="mb-8 border border-line bg-panel/80 px-5 py-4">
            <p class="text-xs text-mute">驗證通過</p>
            <p id="draw-identity" class="mt-1 text-lg font-medium"></p>
          </div>
          <p id="draw-error" class="mb-4 hidden text-sm text-red-400" role="alert"></p>
          <button
            id="btn-draw"
            type="button"
            class="btn-primary btn-draw-glow w-full bg-brand px-4 py-4 text-sm font-semibold tracking-wide text-white transition hover:brightness-110"
          >
            抽取我的遊戲身分
          </button>
        </section>

        <!-- Step 3: Result -->
        <section id="step-result" class="hidden fade-in">
          <div class="scene mx-auto max-w-sm">
            <div id="result-card" class="card-3d">
              <div class="card-face front">
                <p class="text-xs tracking-[0.2em] text-mute">IDENTITY</p>
                <p id="result-front-label" class="mt-4 text-mute">翻開中…</p>
              </div>
              <div class="card-face back">
                <p class="text-xs tracking-[0.2em] text-mute">YOUR ROLE</p>
                <p id="result-role" class="role-pop mt-4 text-3xl font-semibold tracking-tight"></p>
                <span
                  id="result-tag"
                  class="role-pop mt-4 inline-block px-3 py-1 text-xs font-medium"
                ></span>
                <div class="mt-8 w-full border-t border-line pt-5 text-center">
                  <p id="result-name" class="text-sm text-white"></p>
                  <p id="result-id" class="mt-1 text-xs text-mute"></p>
                </div>
              </div>
            </div>
          </div>
          <p id="result-note" class="draw-status mt-8 text-center text-sm text-mute"></p>
          <p id="cert-error" class="mt-4 hidden text-center text-sm text-red-400" role="alert"></p>
          <button
            id="btn-download-cert"
            type="button"
            class="mt-6 hidden w-full bg-brand px-4 py-3.5 text-center text-sm font-semibold tracking-wide text-white transition hover:brightness-110 disabled:cursor-wait disabled:opacity-70"
          >
            下載電子證書
          </button>
          <a
            id="btn-puzzle"
            href="./join.html"
            class="mt-3 hidden block w-full bg-brand px-4 py-3.5 text-center text-sm font-semibold tracking-wide text-white transition hover:brightness-110"
          >
            前往組隊／解謎
          </a>
          <button
            id="btn-reset"
            type="button"
            class="mt-3 w-full border border-line bg-panel px-4 py-3 text-sm text-mute transition hover:border-brand hover:text-white"
          >
            返回查詢
          </button>
        </section>
      </main>

      <footer class="mt-12 text-center text-[11px] text-mute/70">
        <p>抽籤結果由伺服器判定 · 一人僅能抽取一次</p>
        <p class="mt-3 tracking-wide">Made by none.tech · William Lu</p>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-functions-compat.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/certificate.js?v=2"></script>
    <script src="./js/app.js?v=8"></script>
  </body>
</html>
